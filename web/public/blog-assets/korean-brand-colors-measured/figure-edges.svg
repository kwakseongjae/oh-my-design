<svg xmlns="http://www.w3.org/2000/svg" width="720" height="559" viewBox="0 0 720 559" role="img" aria-label="파랑으로 센 색, 세지 않은 색" font-family="'Wanted Sans Variable', 'Wanted Sans', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" lang="ko">
<style>text{font-variant-numeric:tabular-nums}</style>
<rect x="0.5" y="0.5" width="719" height="558" rx="16" fill="#ffffff" stroke="#e5e6eb"/>
<text x="32" y="51" font-size="19" fill="#13131a" font-weight="700">파랑으로 센 색, 세지 않은 색</text>
<text x="32" y="78.65" font-size="14" fill="#5a5a63">무채색 기준을 먼저 보고, 나머지는 색상각으로 나눴습니다</text>
<text x="32" y="130.95" font-size="14" fill="#13131a" font-weight="600">색상각 200~250°: 파랑</text>
<rect x="32" y="145.25" width="152" height="44" rx="8" fill="#3182f6"/>
<text x="32" y="209.25" font-size="14" fill="#13131a" font-weight="600">토스</text>
<text x="32" y="228.75" font-size="13" fill="#5a5a63">#3182f6</text>
<rect x="200" y="145.25" width="152" height="44" rx="8" fill="#0066ff"/>
<text x="200" y="209.25" font-size="14" fill="#13131a" font-weight="600">원티드</text>
<text x="200" y="228.75" font-size="13" fill="#5a5a63">#0066ff</text>
<rect x="368" y="145.25" width="152" height="44" rx="8" fill="#0046ff"/>
<text x="368" y="209.25" font-size="14" fill="#13131a" font-weight="600">신한은행</text>
<text x="368" y="228.75" font-size="13" fill="#5a5a63">#0046ff</text>
<rect x="536" y="145.25" width="152" height="44" rx="8" fill="#0067ac"/>
<text x="536" y="209.25" font-size="14" fill="#13131a" font-weight="600">우리은행</text>
<text x="536" y="228.75" font-size="13" fill="#5a5a63">#0067ac</text>
<text x="32" y="267.25" font-size="14" fill="#13131a" font-weight="600">어두워도 밝기 8% 이상, 채도 10% 이상이면 파랑</text>
<rect x="32" y="281.55" width="152" height="44" rx="8" fill="#002c5f"/>
<text x="32" y="345.55" font-size="14" fill="#13131a" font-weight="600">현대자동차</text>
<text x="32" y="365.05" font-size="13" fill="#5a5a63">#002c5f</text>
<rect x="200" y="281.55" width="152" height="44" rx="8" fill="#1c2028"/>
<text x="200" y="345.55" font-size="14" fill="#13131a" font-weight="600">Bithumb</text>
<text x="200" y="365.05" font-size="13" fill="#5a5a63">#1c2028</text>
<rect x="368" y="281.55" width="152" height="44" rx="8" fill="#15181e"/>
<text x="368" y="345.55" font-size="14" fill="#13131a" font-weight="600">아임웹</text>
<text x="368" y="365.05" font-size="13" fill="#5a5a63">#15181e</text>
<text x="32" y="403.55" font-size="14" fill="#13131a" font-weight="600">파랑으로 세지 않은 색</text>
<rect x="32" y="417.85" width="152" height="44" rx="8" fill="#00b7ff"/>
<text x="32" y="481.85" font-size="14" fill="#13131a" font-weight="600">가우디오랩</text>
<text x="32" y="501.35" font-size="13" fill="#5a5a63">#00b7ff</text>
<text x="32" y="520.85" font-size="13" fill="#13131a">→ 청록</text>
<rect x="200" y="417.85" width="152" height="44" rx="8" fill="#111111"/>
<text x="200" y="481.85" font-size="14" fill="#13131a" font-weight="600">제네시스</text>
<text x="200" y="501.35" font-size="13" fill="#5a5a63">#111111</text>
<text x="200" y="520.85" font-size="13" fill="#13131a">→ 검정에 가까운 무채색</text>
<rect x="368" y="417.85" width="152" height="44" rx="8" fill="#222222"/>
<text x="368" y="481.85" font-size="14" fill="#13131a" font-weight="600">KREAM</text>
<text x="368" y="501.35" font-size="13" fill="#5a5a63">#222222</text>
<text x="368" y="520.85" font-size="13" fill="#13131a">→ 회색</text>
</svg>

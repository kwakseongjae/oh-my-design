<svg xmlns="http://www.w3.org/2000/svg" width="360" height="795" viewBox="0 0 360 795" role="img" aria-label="Counted as blue, and not" font-family="'Wanted Sans Variable', 'Wanted Sans', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" lang="en">

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  :root { font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif; }
  body { font-size: 1rem; line-height: 1.5; letter-spacing: 0; overflow-wrap: anywhere; }
  :lang(ko) { font-synthesis: none; }
  :lang(ko) em, :lang(ko) i { font-style: normal; font-weight: 700; }
  .hero-title { font-size: 2.5rem; line-height: 1.3; letter-spacing: -0.02em; word-break: keep-all; overflow-wrap: anywhere; }
  .btn { font-size: 15px; line-height: 1; letter-spacing: 0; word-break: keep-all; }
  .truncate { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
</head>
<body>
  <h1 class="hero-title">돈 관리, 이제 한 곳에서</h1>
  <p>자세한 내용은 <em>이용약관</em>을 확인하세요.</p>
  <p class="truncate">가격은 12,000원부터 시작합니다.</p>
  <button class="btn">시작하기</button>
</body>
</html>

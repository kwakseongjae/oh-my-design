# Reviewed overlay for the toss conversion. Source bytes: the hash-checked legacy segments held in
# web/references/toss/.omd/system/graph.json (extensions["dev.oh-my-design.migration"]), which is what
# the pipeline reads today. Every fact below is restated from that source or from the Core v2
# projection web/references/toss/DESIGN.md; nothing in that part is new evidence. The `add` and
# `verification` blocks are the one exception: values the official TDS foundation pages state and the
# source lacks, each with its own claim and source (owner G2, 2026-10-13; see TOSS-VERIFY.md).
description: Toss product (TDS Mobile) and toss.im marketing surfaces, kept separate. Values are limited to current computed styles and current official TDS documentation; unresolved values are omitted.
typography:
  h1:
    fontFamily: "Toss Product Sans, sans-serif"
  h2:
    fontFamily: "Toss Product Sans, sans-serif"
  h3:
    fontFamily: "Toss Product Sans, sans-serif"
  h4:
    fontFamily: "Toss Product Sans, sans-serif"
  body:
    fontFamily: "Toss Product Sans, sans-serif"
  body-small:
    fontFamily: "Toss Product Sans, sans-serif"
fonts:
  faces:
    Toss Product Sans:
      scripts: [hangul, latin]
      evidence: [official-product-use, live-surface-use]
      distribution: none-asserted
    Tossface:
      evidence: [declared-only]
  safeDefaults:
    hangul: [Noto Sans KR]
    latin: [Noto Sans]

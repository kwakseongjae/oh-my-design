<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visit prep languages</title><style>
:root{--ink:#201e25;--paper:#faf7ff;--card:#fff;--purple:#5b3fa3;--focus:#08689c;--line:#cec7dd;font:16px/1.5 system-ui,sans-serif}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--paper);color:var(--ink)}main{max-width:920px;margin:auto;padding:32px 14px 70px}h1{font-size:clamp(2.2rem,7vw,5rem);line-height:1;margin:.25em 0}.language-nav{display:flex;flex-wrap:wrap;gap:6px;margin:24px 0}.language-nav button{background:#ebe6f4;color:var(--ink)}.language-nav button[aria-pressed=true]{background:var(--purple);color:white}.content{display:grid;grid-template-columns:1fr .65fr;gap:18px}.checklist,.progress-card{background:var(--card);padding:20px;border-top:3px solid var(--line)}.check{display:flex;align-items:center;gap:12px;min-height:52px;border-bottom:1px solid var(--line)}.check input{width:22px;height:22px}button{min-height:48px;border:0;padding:10px 14px;font:750 1rem/1.2 system-ui,sans-serif}:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.progress-card strong{font-size:2rem}.done{color:#235e3c;font-weight:850}.alert{padding:14px;background:#fff1cf;color:#654700;font-weight:700}@media(max-width:620px){.content{grid-template-columns:1fr}.language-nav button{flex:1 1 92px}}
</style></head><body><main><strong>Sample preparation · not medical advice</strong><h1 id="title">Visit preparation</h1><p id="intro">A fictional checklist that does not infer a diagnosis or represent real clinic policy.</p><nav class="language-nav" aria-label="Language"><button data-locale="ko">한국어</button><button data-locale="en" aria-pressed="true">English</button><button data-locale="ja">日本語</button><button data-locale="zh-CN">简体中文</button><button data-locale="zh-TW">繁體中文（台灣）</button></nav><div class="content"><section class="checklist" aria-labelledby="items-title"><h2 id="items-title">Checklist</h2><label class="check"><input id="one" type="checkbox"> <span id="item-one">Bring identification</span></label><label class="check"><input id="two" type="checkbox"> <span id="item-two">Note questions</span></label></section><aside class="progress-card" aria-labelledby="progress-title"><h2 id="progress-title">Progress</h2><strong id="progress" role="status">0 of 2</strong><p id="done" class="done" hidden>Preparation complete</p></aside></div><button id="unavailable">Preview unavailable translation</button><p id="translation-alert" class="alert" role="alert" hidden>Translation unavailable. The current language and progress were kept.</p></main><script>
const copy={ko:['진료 준비','가상의 준비 목록이며 의료 조언이나 진단, 실제 병원 정책이 아닙니다.','준비 목록','신분증 준비','질문 메모',n=>`${n}/2 완료`],en:['Visit preparation','A fictional checklist that is not medical advice and does not infer a diagnosis or represent real clinic policy.','Checklist','Bring identification','Note questions',n=>`${n} of 2`],ja:['受診の準備','架空の準備リストで、医療助言や診断、実在する医療機関の方針ではありません。','チェックリスト','身分証明書を用意','質問をメモ',n=>`${n}/2 完了`],'zh-CN':['就诊准备','虚构的准备清单，不是医疗建议、诊断或真实诊所政策。','准备清单','准备身份证件','记录问题',n=>`已完成 ${n}/2`],'zh-TW':['就診準備','虛構的準備清單，不是醫療建議、診斷或真實診所政策。','準備清單','準備身分證件','記錄問題',n=>`已完成 ${n}/2`]};let code='en';const buttons=[...document.querySelectorAll('[data-locale]')],checks=[document.querySelector('#one'),document.querySelector('#two')];function render(){const c=copy[code],n=checks.filter(x=>x.checked).length;document.documentElement.lang=code;document.querySelector('#title').textContent=c[0];document.querySelector('#intro').textContent=c[1];document.querySelector('#items-title').textContent=c[2];document.querySelector('#item-one').textContent=c[3];document.querySelector('#item-two').textContent=c[4];document.querySelector('#progress').textContent=c[5](n);document.querySelector('#done').hidden=n!==2;buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.locale===code)))}buttons.forEach(b=>b.onclick=()=>{code=b.dataset.locale;render()});checks.forEach(x=>x.onchange=render);document.querySelector('#unavailable').onclick=()=>{document.querySelector('#translation-alert').hidden=false};render();
</script></body></html>
